<!DOCTYPE html>
<html>
<head>
  <title>Sign in to TachoTasks</title>
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #0f1117;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .spinner {
      border: 4px solid rgba(255,255,255,0.1);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border-left-color: #00d4aa;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div class="spinner" id="spinner"></div>
  <h2 id="status-text">Opening Google sign in...</h2>
  <button id="sign-in-btn" style="display:none; padding: 12px 24px; font-size: 16px; border-radius: 8px; border: none; background: #00d4aa; color: #0f1117; font-weight: bold; cursor: pointer; margin-top: 20px;">
    Sign in with Google
  </button>
  
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = window.__FIREBASE_CONFIG__ || {};

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    provider.addScope('https://www.googleapis.com/auth/calendar.readonly');
    provider.setCustomParameters({
      access_type: 'offline',
      prompt: 'consent'
    });

    async function doSignIn() {
      document.getElementById('sign-in-btn').style.display = 'none';
      document.getElementById('spinner').style.display = 'block';
      document.getElementById('status-text').innerText = 'Opening Google sign in...';

      try {
        const result = await signInWithPopup(auth, provider);
        const credential = GoogleAuthProvider.credentialFromResult(result);
        const idToken = credential ? credential.idToken : null;
        const accessToken = credential ? credential.accessToken : null;
        const tokenResponse = result._tokenResponse || {};
        const refreshToken = tokenResponse.refreshToken || (result.user && result.user.refreshToken) || null;
        const expiresIn = tokenResponse.oauthExpireIn || 3600;
        const clientId = tokenResponse.clientId || tokenResponse.oauthClientId || null;

        // Obtain Google OAuth authorization code for persistent refresh token
        let authCode = null;
        if (clientId && window.google && window.google.accounts && window.google.accounts.oauth2) {
          try {
            authCode = await new Promise((resolveCode) => {
              const codeClient = window.google.accounts.oauth2.initCodeClient({
                client_id: clientId,
                scope: 'https://www.googleapis.com/auth/calendar.readonly openid email profile',
                ux_mode: 'popup',
                callback: (resp) => {
                  if (resp && resp.code) {
                    resolveCode(resp.code);
                  } else {
                    resolveCode(null);
                  }
                },
                error_callback: () => resolveCode(null)
              });
              codeClient.requestCode();
            });
          } catch (e) {
            console.warn('Failed to obtain Google auth code:', e);
          }
        }
        
        document.getElementById('status-text').innerText = 'Success! Returning to TachoTasks...';
        document.getElementById('spinner').style.display = 'none';

        await fetch('/auth-callback', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ idToken, accessToken, refreshToken, expiresIn, clientId, authCode })
        });

        setTimeout(() => { window.close(); }, 500);
      } catch (error) {
        console.error('Sign-in error:', error);
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('sign-in-btn').style.display = 'block';
        if (error.code === 'auth/popup-closed-by-user') {
          document.getElementById('status-text').innerText = 'Sign in cancelled. Click below to try again:';
        } else {
          document.getElementById('status-text').innerText = 'Sign in error. Click below to try again:';
        }
      }
    }

    // Auto-trigger sign in popup on page load
    doSignIn();

    document.getElementById('sign-in-btn').addEventListener('click', doSignIn);
  </script>
</body>
</html>
