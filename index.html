<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Tacho Tasks — A unified daily command center for schedule, tasks, and life events" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=50">
  <link rel="icon" href="assets/brand/logo.png" type="image/png">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <title>Tacho Tasks</title>
</head>

<body>
  <div id="app">
    <!-- ===== SIDEBAR ===== -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <div class="logo-icon"><img src="assets/brand/logo.png" alt="Tacho Tasks Logo" /></div>
        <span class="logo-text">Tacho Tasks</span>
        <div style="flex:1"></div>
        <div class="sidebar-header-actions" style="display:flex;align-items:center;gap:6px;">
          <button class="icon-btn" id="header-settings-btn" title="Settings"
            style="width: 22px; height: 22px; color: var(--text-secondary); flex-shrink: 0; padding: 2px; border: none; background: none; cursor: pointer; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center;">
            <img src="assets/icons/Settings.png" alt="Settings"
              style="width: 16px; height: 16px; object-fit: contain; display: block; opacity: 0.75;" />
          </button>
          <button class="icon-btn" id="sidebar-toggle-btn" title="Collapse sidebar"
            style="width: 22px; height: 22px; color: var(--text-secondary); flex-shrink: 0; padding: 2px; border: none; background: none; cursor: pointer; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center;">
            <img src="assets/icons/Down.png" alt="Toggle sidebar" class="sidebar-toggle-arrow"
              style="width: 14px; height: 14px; object-fit: contain; display: block; opacity: 0.75; transform: rotate(90deg); transition: transform 0.25s ease;" />
          </button>
        </div>
      </div>

      <nav class="sidebar-nav" id="sidebar-nav">
        <button class="nav-item active" data-view="dashboard" id="nav-dashboard">
          <img class="nav-icon" src="assets/icons/Dashboard.png" alt="Dashboard" style="width:22px;height:22px;object-fit:contain;" />
          <span>Dashboard</span>
        </button>
        <button class="nav-item" data-view="tasks" id="nav-tasks">
          <img class="nav-icon" src="assets/icons/Task.png" alt="Tasks" style="width:22px;height:22px;object-fit:contain;" />
          <span>Tasks</span>
        </button>
        <button class="nav-item" data-view="calendar" id="nav-calendar">
          <img class="nav-icon" src="assets/icons/Calendar.png" alt="Calendar" style="width:22px;height:22px;object-fit:contain;" />
          <span>Calendar</span>
        </button>
        <button class="nav-item" data-view="planner" id="nav-planner">
          <img class="nav-icon" src="assets/icons/Planner.png" alt="Planner" style="width:22px;height:22px;object-fit:contain;" />
          <span>Weekly Planner</span>
          <span class="nav-wip-badge">WIP</span>
        </button>
      </nav>

      <div class="sidebar-divider"></div>

      <!-- Categories & Projects -->
      <div class="sidebar-section">
        <div class="sidebar-section-header" id="header-projects" style="cursor: pointer;">
          <img class="collapse-arrow" src="assets/icons/Down.png" alt="Toggle"
            style="width:18px;height:18px;object-fit:contain;transition:transform 0.2s;margin-right:4px;" />
          <span>Projects</span>
          <span class="nav-wip-badge">WIP</span>
          <button class="sidebar-add-btn" id="add-project-btn" title="Add project"
            onclick="event.stopPropagation()">+</button>
        </div>
        <div id="sidebar-projects" class="sidebar-list"></div>
      </div>

      <div class="sidebar-divider"></div>

      <!-- Google Calendars (Hidden unless signed in) -->
      <div id="gcal-sidebar-section" class="sidebar-section hidden">
        <div class="sidebar-section-header" id="header-gcal" style="cursor: pointer;">
          <img class="collapse-arrow" src="assets/icons/Down.png" alt="Toggle"
            style="width:18px;height:18px;object-fit:contain;transition:transform 0.2s;margin-right:4px;" />
          <span>Google Calendars</span>
          <button id="refresh-gcals-btn" class="icon-btn" title="Refresh Calendars"
            style="width: 16px; height: 16px; margin-left: auto; background: transparent; border: none; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center;" onclick="event.stopPropagation()">
            <img src="assets/icons/Refresh.png" alt="Refresh" style="width:100%;height:100%;object-fit:contain;opacity:0.7;" />
          </button>
        </div>
        <div id="gcal-list" class="sidebar-list gcal-list">
          <div style="font-size: 11px; color: var(--text-tertiary); padding: 5px;">Loading calendars...</div>
        </div>
      </div>

      <!-- Tags -->
      <div class="sidebar-section" id="tags-sidebar-section" style="display:none;">
        <div class="sidebar-section-header" id="header-tags" style="cursor: pointer;">
          <img class="collapse-arrow" src="assets/icons/Down.png" alt="Toggle"
            style="width:18px;height:18px;object-fit:contain;transition:transform 0.2s;margin-right:4px;" />
          <span>Tags</span>
        </div>
        <div id="sidebar-tags" class="sidebar-list"></div>
      </div>

      <!-- Account & Sync (Moved to bottom) -->
      <div class="sidebar-section" id="account-section">
        <div class="account-actions" style="margin-bottom:8px;">
          <button class="nav-item" data-view="archive" id="nav-archive"
            style="width:100%;justify-content:flex-start;padding:8px;font-size:13px;border-radius:var(--radius-md);">
            <img class="nav-icon" src="assets/icons/Archive.png" alt="Archive" style="width:20px;height:20px;object-fit:contain;margin-right:8px;" />
            <span>Archive</span>
          </button>
        </div>

        <div id="auth-section" class="sidebar-auth-section">
          <div id="user-profile" class="user-profile hidden">
            <img id="user-avatar" src="" alt="Avatar" class="user-avatar" />
            <div class="user-info">
              <div class="user-header-row" style="display:flex; justify-content:space-between; align-items:center;">
                <div id="user-name" class="user-name">Name</div>
                <div class="user-actions-row" style="display:flex; gap:6px; align-items:center;">
                  <button id="manual-sync-btn" class="icon-btn" title="Sync with Cloud"
                    style="width:16px;height:16px;padding:0;background:transparent;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                    <img src="assets/icons/Refresh.png" alt="Sync" style="width:100%;height:100%;object-fit:contain;opacity:0.75;transition:opacity 0.15s;" />
                  </button>
                  <button id="sign-out-btn" class="icon-btn" title="Sign Out"
                    style="width:16px;height:16px;padding:0;background:transparent;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                    <img src="assets/icons/Sign out.png" alt="Sign Out" style="width:100%;height:100%;object-fit:contain;opacity:0.75;transition:opacity 0.15s;" />
                  </button>
                </div>
              </div>
              <div id="user-email" class="user-email" style="font-size:11px;color:var(--text-tertiary);"></div>
            </div>
          </div>

          <button id="sign-in-btn" class="sign-in-btn">
            <img src="assets/icons/Add.png" alt="Sign in" style="width:20px;height:20px;object-fit:contain;margin-right:6px;" />
            Sign in with Google
          </button>
          
          <div id="sidebar-statuses" class="sidebar-statuses" style="display:flex;flex-direction:column;gap:3px;margin-top:4px;">
            <div id="gcal-status" class="gcal-connection-status" style="display:none;">
              <span class="gcal-status-dot"></span>
              <span class="gcal-status-text">Google Calendar connected</span>
            </div>
            <div id="sync-status" class="sync-status"></div>
          </div>
        </div>
      </div>
    </aside>

    <!-- ===== MAIN CONTENT ===== -->
    <main id="main">
      <div id="view-container"></div>
      <div id="quick-add-bar" style="display: none;">
        <div class="quick-add-icon" style="width:32px;height:32px;">
          <img src="assets/icons/Add.png" alt="Add" style="width:22px;height:22px;object-fit:contain;" />
        </div>
        <input type="text" id="quick-add-input"
          placeholder="Add a task… try: &quot;Review docs tomorrow at 3pm p1 @deep_work&quot;" autocomplete="off" />
        <div class="quick-add-hint"><kbd>Enter</kbd> to add</div>
      </div>
    </main>

    <!-- ===== TASK INSPECTOR (Right Panel) ===== -->
    <aside id="task-inspector" class="task-inspector">
      <div id="inspector-content"></div>
    </aside>
  </div>

  <!-- Modal -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div id="modal-container" class="modal-container"></div>
  </div>

  <!-- Toasts -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Event Popover -->
  <div id="event-popover" class="event-popover hidden"></div>

  <!-- Login Overlay -->
  <div id="login-overlay" class="login-overlay hidden">
    <div class="login-card">
      <div class="login-logo">
        <img src="assets/brand/logo.png" alt="Tacho Tasks" style="width:64px;height:64px;" />
      </div>
      <h1 style="font-size:24px;font-weight:700;color:var(--text-primary);margin:16px 0 8px;">Tacho Tasks</h1>
      <p style="color:var(--text-secondary);font-size:14px;margin-bottom:32px;">Sign in to get started</p>
      <button id="login-overlay-btn" class="sign-in-btn" style="max-width:280px;margin:0 auto;">
        <img src="assets/icons/Add.png" alt="Sign in" style="width:20px;height:20px;object-fit:contain;margin-right:6px;" />
        Sign in with Google
      </button>
    </div>
  </div>

  <!-- Context Menu -->
  <div id="context-menu" class="context-menu hidden"></div>

  <script type="module" src="js/browser-api.js?v=60"></script>
  <script src="js/state.js?v=60"></script>
  <script src="js/utils.js?v=60"></script>
  <script src="js/utils/nlp-parser.js?v=60"></script>
  <script src="js/data.js?v=60"></script>
  <script src="js/components/modal-base.js?v=60"></script>
  <script src="js/components/date-selector.js?v=60"></script>
  <script src="js/components/task-menu.js?v=60"></script>
  <script src="js/components/inline-task-create.js?v=60"></script>
  <script src="js/components/task-modal.js?v=69"></script>
  <script src="js/components/project-modal.js?v=60"></script>
  <script src="js/components/section-menu.js?v=60"></script>
  <script src="js/components/auth-sync.js?v=60"></script>
  <script src="js/components/task-item.js?v=60"></script>
  <script src="js/components/event-popover.js?v=60"></script>
  <script src="js/components/quick-add.js?v=60"></script>
  <script src="js/components/drag-drop.js?v=60"></script>
  <script src="js/components/sidebar.js?v=60"></script>
  <script src="js/views/dashboard.js?v=60"></script>
  <script src="js/views/tasks.js?v=60"></script>
  <script src="js/views/project.js?v=60"></script>
  <script src="js/views/archive.js?v=60"></script>
  <script src="js/views/calendar-schedule.js?v=60"></script>
  <script src="js/views/calendar-month.js?v=60"></script>
  <script src="js/views/calendar-grid.js?v=60"></script>
  <script src="js/views/calendar.js?v=60"></script>
  <script src="js/views/planner.js?v=60"></script>
  <script src="js/views/settings.js?v=60"></script>
  <script src="js/app.js?v=60"></script>
</body>

</html>
