name: Build & Release Electron Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run automated test suite
        run: |
          node tests/refresh-regressions.test.cjs
          node tests/sqlite-db.test.cjs
          node tests/desktop-regressions.test.cjs
          node tests/google-auth-regressions.test.cjs
          node tests/task-completion-sync.test.cjs
          node tests/desktop-updater.test.cjs
          node tests/archive.test.cjs
          node tests/overdue.test.cjs

      - name: Build web assets
        run: npm run build:web

      - name: Build installers
        run: npx electron-builder --publish never

      - name: Save installers for manual runs
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.yml
            release/*.blockmap

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          files: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.yml
            release/*.blockmap
